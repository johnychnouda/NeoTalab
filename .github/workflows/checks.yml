# Runs on every push and pull request: the backend tests and code style, and the web build.
# A red check means the update is broken; fix it before it goes live.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # same as production (backend/Dockerfile)
          extensions: mbstring, intl, bcmath, zip, pdo_sqlite, pcntl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style
        run: ./vendor/bin/pint --test
      - name: Tests (in-memory SQLite, every outside call faked)
        run: php artisan test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
